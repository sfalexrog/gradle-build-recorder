[versions]
kotlin = "2.2.0"
kotlinx-serialization = "1.9.0"
kotlinx-schema = "0.6.0"

gradle-tooling-api = "9.4.1"
slf4j = "2.0.18"

clikt = "5.1.0"
shadow = "9.6.1"

junit = "6.1.3"

detekt = "2.0.0-alpha.6"

async-profiler = "4.5"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-schema-generator-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-schema-generator-json", version.ref = "kotlinx-schema" }

gradle-tooling-api = { group = "org.gradle", name = "gradle-tooling-api", version.ref = "gradle-tooling-api" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt" }

kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

detekt-gradlePlugin = { group = "dev.detekt", name = "dev.detekt.gradle.plugin", version.ref = "detekt" }
async-profiler = { group = "tools.profiler", name = "async-profiler", version.ref = "async-profiler" }

[plugins]
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinx-schema-ksp = { id = "org.jetbrains.kotlinx.schema.ksp", version.ref = "kotlinx-schema" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

# Convention plugins (defined in build-logic/convention)
convention-jvm-module = { id = "com.github.sfalexrog.jvm-module" }
detekt = { id = "dev.detekt", version.ref = "detekt" }